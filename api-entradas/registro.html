<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styleLogin.css">
    <!-- iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Crear cuenta | Reservar entradas para conciertos</title>
    <meta name="description" content="Regístrate para reservar entradas para los mejores conciertos en España 2026. 
    Crea tu cuenta, consulta fechas y reserva tus eventos favoritos de forma rápida y segura.">
    <meta name="keywords" content="registro conciertos España 2026, crear cuenta conciertos, reservar entradas conciertos, 
    fechas conciertos España, artistas conciertos España, recintos conciertos España">
</head>

<body>

    <header class="main-header">
        <div class="header-left">
            <a href="../">
                <div class="logo-box">LOGO</div>
            </a>
        </div>
        <div class="header-center">
            <div class="search-bar">
                <input type="text" placeholder="BARRA DE BÚSQUEDA" aria-label="Barra de Búsqueda">
                <i class="fas fa-search"></i>
            </div>
        </div>
        <div class="header-right">
            <a href="/api-entradas/perfil" class="user-icon-circle" aria-label="Perfil">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </header>

    <main class="content-container">
        <h1 class="page-title">REGISTRO</h1>

        <!--Datos Personales-->
        <section class="collapsible-section">

            <div class="section-header">
                <h2>DATOS PERSONALES</h2>
                <i class="fas fa-chevron-down"></i>
            </div>
            <form>
                <div class="personal-data-grid">
                    <div class="form-inputs">
                        <input id="nombre" type="text" class="custom-input" placeholder="Nombre" aria-label="Nombre">
                        <input id="email" type="text" class="custom-input" placeholder="Email" aria-label="Email">
                        <input id="password" type="password" class="custom-input" placeholder="Contraseña"
                            aria-label="Contraseña">
                        <input id="foto_perfil" type="file" class="subir-archivo" aria-label="Subir foto de perfil">
                    </div>
                    <div class="">
                        <div class="perfil-img">
                            <img id="foto-perfil"
                                src="../api-entradas/public/uploads/usuarios/foto-perfil-placeholder-_1_.webp"
                                alt="foto-perfil">
                        </div>
                    </div>
                    <button type="button" onclick="registrarUsuario()" class="modificar-btn" aria-label="Registrar">
                        Registrar
                    </button>
                    <pre id="resultadoUsuario"></pre>
                </div>
            </form>




            <script>
                function registrarUsuario() {
                    const archivoFoto = document.getElementById("foto_perfil").files[0];

                    const data = {
                        nombre: document.getElementById("nombre").value,
                        email: document.getElementById("email").value,
                        password: document.getElementById("password").value
                    };

                    const resultado = document.getElementById("resultadoUsuario");

                    fetch("/api-entradas/public/api/usuarios", {
                        method: "POST",
                        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                        credentials: "include",
                        body: JSON.stringify(data)
                    })
                        .then(async respuesta => {

                            // Gestión de errores
                            if (!respuesta.ok) {
                                let mensaje = "Error en el registro";

                                if (respuesta.status === 400) mensaje = "Datos inválidos enviados al servidor";
                                if (respuesta.status === 401) mensaje = "No autorizado";
                                if (respuesta.status === 409) mensaje = "El email ya está registrado";
                                if (respuesta.status === 500) mensaje = "Error interno del servidor";

                                // Intentar leer el JSON del servidor si existe
                                let errorData;
                                try {
                                    errorData = await respuesta.json();
                                    if (errorData.error) mensaje += ": " + errorData.error;
                                } catch (e) { }

                                throw new Error(mensaje);
                            }

                            return respuesta.json();
                        })
                        .then(datos => {
                            console.log(datos);
                            resultado.textContent = "Usuario registrado correctamente";

                            setTimeout(() => {
                                window.location.href = "login";
                            }, 2200);

                            if (archivoFoto && datos.id) {
                                const formData = new FormData();
                                formData.append("imagen", archivoFoto);

                                return fetch(`/api-entradas/public/api/usuarios/${datos.id}/foto`, {
                                    method: "POST",
                                    credentials: "include",
                                    body: formData
                                })
                                    .then(res => res.json())
                                    .then(fotoData => {
                                        console.log("Foto subida:", fotoData);

                                        resultado.textContent = "Usuario registrado correctamente. Foto subida.";
                                        setTimeout(() => {
                                            window.location.href = "login";
                                        }, 2200);
                                    });
                            }
                        })
                        .catch(error => {
                            console.error("Error ", error);

                            if (error instanceof TypeError) {
                                resultado.textContent = "Error de red: no se pudo conectar con el servidor.";
                                return;
                            }

                            resultado.textContent = error.message || "Error al registrar usuario";
                        });

                }



                //subir foto de perfil
                document.getElementById("foto_perfil").addEventListener("change", function () {
                    const archivo = this.files[0];
                    if (archivo) {
                        const urlTemporal = URL.createObjectURL(archivo);
                        document.getElementById("foto-perfil").src = urlTemporal;
                    }
                });


            </script>
        </section>
    </main>

    <footer>
        <div class="footer-content content-container">
            <p>&copy; 2026 Venta de Entradas. Todos los derechos reservados.</p>
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Facturación | Pago Entradas</title>
    <link rel="stylesheet" href="../styleHome.css">
    <link rel="stylesheet" href="../../css/DatosFacturacion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="description" content="Introduce tus datos de facturación para completar la compra de tus entradas. 
    Información segura y opciones de pago disponibles.">
    <meta name="keywords" content="Datos de Facturación, Compra de Entradas, Información de Pago, Facturación, 
    Conciertos, Eventos, Tickets, Seguridad en Pagos">   
</head>
<body>
    <!--Header-->
    <header class="main-header">
        <div class="header-left">
            <a href="/index.html">
                <div class="logo-box">LOGO</div>
            </a>
        </div>
        <div class="header-center">
            <div class="search-bar">
                <input type="text" placeholder="BARRA DE BÚSQUEDA" aria-label="Barra de Búsqueda">
                <i class="fas fa-search"></i>
            </div>
        </div>
        <div class="header-right">
            <a href="/api-entradas/perfil.html" class="user-icon-circle" aria-label="Perfil">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </header>
     
    <main id="main-content">
        <section class="billing-section">
            <h1>DATOS DE FACTURACIÓN</h1>
            
            <div class="billing-container">
                <div class="billing-left-column">
                    <!-- Sección Izquierda: Datos del Comprador -->
                    <div class="buyer-data">
                        <h2>DATOS DEL COMPRADOR</h2>
                        
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre">
                        </div>

                        <div class="form-group">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" name="apellidos" placeholder="Primer y Segundo Apellido">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="danieltatagata@gmail.com">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="descuento">Descuento</label>
                                <input type="text" id="descuento" name="descuento" placeholder="0000 0000 0000 XXXX">
                            </div>
                            <div class="form-group">
                                <label for="telefono">Número de Teléfono</label>
                                <input type="tel" id="telefono" name="telefono" placeholder="+34">
                            </div>
                        </div>
                    </div>

                    <!-- Sección Método de Pago -->
                    <fieldset class="payment-method-section">
                        <legend></legend><h2>MÉTODO DE PAGO</h2></legend>
                        
                        <section class="payment-options">
                            <div class="option-content">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="card" checked>
                                
                                    <i class="fas fa-credit-card"></i>
                                    <br>
                                    <span>Tarjeta</span>
                                
                            </label>
                            </div>
                            <div class="option-content">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="wallet">
                                
                                    <i class="fas fa-wallet"></i>
                                    <br>
                                    <span>Wallet</span>
                                
                            </label>
                            </div>
                            <div class="option-content">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="applepay">
                                    <i class="fab fa-apple"></i>
                                    <br>
                                    <span>Apple Pay</span>
                            </label>
                            </div>
                        </section>

                        <div class="payment-form">
                            <div class="form-group">
                                <label for="card-name">Nombre</label>
                                <input type="text" id="card-name" name="card-name" placeholder="Nombre y apellidos">
                            </div>

                            <div class="form-group">
                                <label for="card-number">Número de Tarjeta</label>
                                <input type="text" id="card-number" name="card-number" placeholder="0000 0000 0000 0000">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="expiry-month">Fecha Caducidad</label>
                                    <select id="expiry-month" name="expiry-month" aria-label="mes">
                                        <option value="">MM</option>
                                        <option value="01">01</option>
                                        <option value="02">02</option>
                                        <option value="03">03</option>
                                        <option value="04">04</option>
                                        <option value="05">05</option>
                                        <option value="06">06</option>
                                        <option value="07">07</option>
                                        <option value="08">08</option>
                                        <option value="09">09</option>
                                        <option value="10">10</option>
                                        <option value="11">11</option>
                                        <option value="12">12</option>
                                    </select>
                                </div>

                                <div class="form-group no-label-align">
                                    <select id="expiry-year" name="expiry-year" aria-label="año">
                                        <option value="">YYYY</option>
                                        <option value="2025">2025</option>
                                        <option value="2026">2026</option>
                                        <option value="2027">2027</option>
                                        <option value="2028">2028</option>
                                        <option value="2029">2029</option>
                                        <option value="2030">2030</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" name="cvv" placeholder="CVV" maxlength="3">
                                </div>
                            </div>
                        </div>
                    </fieldset>
                </div>

                <!-- Sección Derecha: Resumen de Compra -->
                <div class="purchase-summary">
                    <h2>RESUMEN DE COMPRA</h2>
                    
                    <div class="event-info">
                        <img src="https://via.placeholder.com/120x120?text=Evento" alt="Evento" class="event-icon" id="eventImage">
                        <div>
                            <p class="event-name" id="eventName">Nombre del evento</p>
                            <p class="event-description" id="eventDescription">Pequeña descripción del evento.</p>
                        </div>
                    </div>

                    <div class="summary-details">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span class="amount" id="subtotalAmount">120.00 €</span>
                        </div>
                        <div class="summary-row">
                            <span>IVA</span>
                            <span class="amount" id="ivaAmount">3.00 €</span>
                        </div>
                        <div class="summary-row">
                            <span>Descuento</span>
                            <span class="amount" id="descuentoAmount">0.00 €</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span class="amount" id="totalAmount">123 €</span>
                        </div>
                    </div>

                    <button class="pay-button">PAGAR</button>
                </div>
            </div>

        </section>
    </main>
    <footer>
        <div class="footer-content content-container">
            <p>&copy; 2026 Venta de Entradas. Todos los derechos reservados.</p>
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const API_BASE = "/api-entradas/public/api";
            const PUBLIC_BASE = "/api-entradas/public";

            const nameElement = document.getElementById("eventName");
            const descriptionElement = document.getElementById("eventDescription");
            const imageElement = document.getElementById("eventImage");
            const subtotalAmount = document.getElementById("subtotalAmount");
            const ivaAmount = document.getElementById("ivaAmount");
            const descuentoAmount = document.getElementById("descuentoAmount");
            const totalAmount = document.getElementById("totalAmount");
            const payButton = document.querySelector(".pay-button");

            if (!nameElement || !descriptionElement || !imageElement) {
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const eventoId = params.get("evento_id");
            const entradasGuardadas = sessionStorage.getItem("compraEntradasSeleccionadas");
            const entradas = parseInt(entradasGuardadas || params.get("entradas") || "0", 10) || 0;

            function formatEuro(value) {
                return value.toFixed(2) + " €";
            }

            // Mantener el mismo criterio visual usado en la plantilla original (3 sobre 120 => 2.5%).
            const subtotal = entradas * 40;
            const iva = subtotal * 0.025;
            const descuento = 0;
            const total = subtotal + iva - descuento;

            if (subtotalAmount) subtotalAmount.textContent = formatEuro(subtotal);
            if (ivaAmount) ivaAmount.textContent = formatEuro(iva);
            if (descuentoAmount) descuentoAmount.textContent = formatEuro(descuento);
            if (totalAmount) totalAmount.textContent = formatEuro(total);

            if (payButton) {
                payButton.addEventListener("click", () => {
                    if (!eventoId || entradas <= 0) {
                        alert("Faltan datos de la compra. Vuelve a seleccionar las entradas.");
                        return;
                    }

                    fetch(`${API_BASE}/sesion`, {
                        method: "GET",
                        credentials: "include"
                    })
                        .then(async res => {
                            const data = await res.json().catch(() => ({}));
                            if (!res.ok) {
                                throw new Error(data.error || "No se pudo validar la sesion.");
                            }
                            return data;
                        })
                        .then(sesion => {
                            if (!sesion.logueado || !sesion.usuario_id) {
                                throw new Error("Debes iniciar sesión para completar la compra.");
                            }

                            return fetch(`${API_BASE}/reservas`, {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                credentials: "include",
                                body: JSON.stringify({
                                    usuario_id: sesion.usuario_id,
                                    evento_id: Number(eventoId),
                                    cantidad: entradas
                                })
                            });
                        })
                        .then(async res => {
                            const raw = await res.text();
                            let data = {};
                            try {
                                data = raw ? JSON.parse(raw) : {};
                            } catch (_) {
                                data = {};
                            }

                            if (!res.ok || data.error) {
                                const detalle = data.error || (raw ? `Respuesta inesperada del servidor: ${raw.slice(0, 120)}` : "Sin detalle");
                                throw new Error(`No se pudo completar la reserva (HTTP ${res.status}). ${detalle}`);
                            }

                            alert("Reserva realizada correctamente.");
                            sessionStorage.removeItem("compraEntradasSeleccionadas");
                            window.location.href = "/api-entradas/perfil.html";
                        })
                        .catch(error => {
                            alert(error.message || "Error al procesar el pago.");
                        });
                });
            }

            if (!eventoId) {
                return;
            }

            fetch(`${API_BASE}/eventos/${encodeURIComponent(eventoId)}`)
                .then(res => res.json())
                .then(data => {
                    const evento = data.data ?? data;
                    if (evento && evento.nombre) {
                        nameElement.textContent = evento.nombre;
                    }
                    if (evento && evento.descripcion) {
                        descriptionElement.textContent = evento.descripcion;
                    }
                    if (evento && evento.imagen) {
                        imageElement.src = PUBLIC_BASE + evento.imagen;
                    }
                })
                .catch(() => {
                    // Mantener texto por defecto si falla la carga
                });
        });
    </script>

</body>
</html>

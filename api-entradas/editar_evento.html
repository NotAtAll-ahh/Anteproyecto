<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Evento</title>
    <!-- Incluimos Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'Kabel';
            src: url("./public/uploads/fonts/Semplicita\ Light.otf");
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url("./public/uploads/imgsHTML/declan-sun-rCQ4LlLzqFk-unsplash.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            color: white;
            margin: 0;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .header-left a {
            color: inherit;
            text-decoration: none;
        }

        .logo-box {
            border: 1px solid white;
            padding: 5px 15px;
            font-size: 0.8rem;
        }

        .search-bar {
            display: flex;
            align-items: center;
            border-bottom: 1px solid white;
            width: 400px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            padding: 5px;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: white;
            opacity: 0.7;
        }

        .user-icon-circle {
            width: 40px;
            height: 40px;
            background-color: #3b6182;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
        }

        .user-icon-circle:visited,
        .user-icon-circle:hover,
        .user-icon-circle:active,
        .user-icon-circle:focus {
            color: white;
            text-decoration: none;
        }

        .contenedor {
            max-width: 600px;
            margin: 20px auto 40px;
            background: #ffffff11;
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1,
        h2,
        h3 {
            font-family: "Kabel";
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
        }

        #imagenActual {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: block;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-top: 20px;
            margin-left: 15px;
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.8);
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px 20px;
            margin-top: 5px;
            margin-bottom: 10px;
            background: transparent;
            border: 1px solid white;
            border-radius: 50px;
            color: white;
            outline: none;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        textarea {
            border-radius: 20px;
            min-height: 80px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }

        input[type="file"] {
            margin: 15px 0;
            font-size: 0.8rem;
        }

        button {
            font-family: "Kabel";
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid white;
            background-color: transparent;
            color: #ffffff;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: white;
            color: #1a2a3a;
            transform: translateY(-2px);
        }

        hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 30px 0;
        }

        #mensajeRol {
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        #resultado {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            word-break: break-all;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        #soloAdmin {
            display: none;
        }
    </style>
</head>

<body>


    <script>
        // Esta función es solo para que puedas visualizar el formulario en esta demo
        window.onload = function () {
            document.getElementById('soloAdmin').style.display = 'block';
        }
    </script>

    <header class="main-header">
        <div class="header-left">
            <a href="./index.html">
                <div class="logo-box">LOGO</div>
            </a>
        </div>
        <div class="header-center">
            <form action="api-entradas/resultados" method="GET" class="search-form">
            <div class="search-bar">
                
                <input type="text" placeholder="BARRA DE BÚSQUEDA" aria-label="Buscar eventos" id="search-input">
                
                <i class="fas fa-search"></i>
                
                
            </div>
            </form>
        </div>
        <div class="header-right">
            <a href="api-entradas/perfil" class="user-icon-circle" aria-label="Perfil">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </header>
    <main>
        <div class="contenedor">
            <h1><i class="fas fa-edit"></i> Editar Evento</h1>

            <p id="mensajeRol" style="color:#ff3366;"></p>

            <div id="soloAdmin">
                <img id="imagenActual" src="/api-entradas/public/uploads/imgsHTML/Fondo-Evento-Placeholder.webp"
                    alt="Imagen del evento: " + evento.nombre>
                <hr>

                <label for="nombre"><i class="fas fa-tag"></i> Nombre</label>
                <input type="text" id="nombre" aria-label="Nombre del evento">

                <label for="descripcion"><i class="fas fa-align-left"></i> Descripción</label>
                <textarea id="descripcion" aria-label="Descripción del evento"></textarea>

                <label for="ubicacion"><i class="fas fa-map-marker-alt"></i> Ubicación</label>
                <input type="text" id="ubicacion" aria-label="Ubicación del evento">

                <label for="fecha"><i class="fas fa-calendar-alt"></i> Fecha</label>
                <input type="date" id="fecha" aria-label="Fecha del evento">

                <label for="entradas_totales"><i class="fas fa-ticket-alt"></i> Entradas totales</label>
                <input type="number" id="entradas_totales" aria-label="Entradas totales">

                <label for="entradas_disponibles"><i class="fas fa-users"></i> Entradas disponibles</label>
                <input type="number" id="entradas_disponibles" aria-label="Entradas disponibles">

                <button onclick="guardarCambios()">Guardar cambios</button>

                <hr>

                <h2><i class="fas fa-image"></i> Subir nueva imagen</h2>
                <input type="file" id="nuevaImagen" aria-label="Seleccionar nueva imagen del evento">
                <button onclick="subirImagen()">Actualizar Imagen</button>

                <p id="resultado"></p>
            </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const eventoId = params.get("id");

            let usuarioRol = null;

            async function leerJsonSeguro(res) {
                const texto = await res.text();

                try {
                    return texto ? JSON.parse(texto) : {};
                } catch (error) {
                    throw new Error("El servidor devolvio una respuesta invalida: " + texto);
                }
            }

            function normalizarFechaParaInput(valor) {
                if (!valor) {
                    return "";
                }

                return String(valor).slice(0, 10);
            }

            // 1. Comprobar sesión
            fetch("/api-entradas/public/api/sesion", {
                method: "GET",
                credentials: "include"
            })
                .then(res => res.json())
                .then(data => {
                    if (!data.logueado) {
                        document.getElementById("mensajeRol").textContent =
                            "Debes iniciar sesión.";
                        return;
                    }

                    usuarioRol = data.rol;

                    if (usuarioRol === "admin") {
                        document.getElementById("soloAdmin").style.display = "block";
                        cargarEvento();
                    } else {
                        document.getElementById("mensajeRol").textContent =
                            "No tienes permisos para editar eventos.";
                    }
                });

            // 2. Cargar datos del evento
            function cargarEvento() {
                fetch(`/api-entradas/public/api/eventos/${eventoId}`)
                    .then(res => res.json())
                    .then(data => {
                        const e = data.data;

                        document.getElementById("nombre").value = e.nombre;
                        document.getElementById("descripcion").value = e.descripcion;
                        document.getElementById("ubicacion").value = e.ubicacion;
                        document.getElementById("fecha").value = normalizarFechaParaInput(e.fecha);
                        document.getElementById("entradas_totales").value = e.entradas_totales;
                        document.getElementById("entradas_disponibles").value = e.entradas_disponibles;

                        if (e.imagen) {
                            document.getElementById("imagenActual").src =
                                "/api-entradas/public" + e.imagen;
                        }
                    });
            }

            // 3. Guardar cambios del evento
            function guardarCambios() {
                const data = {
                    nombre: document.getElementById("nombre").value,
                    descripcion: document.getElementById("descripcion").value,
                    ubicacion: document.getElementById("ubicacion").value,
                    fecha: document.getElementById("fecha").value,
                    entradas_totales: document.getElementById("entradas_totales").value,
                    entradas_disponibles: document.getElementById("entradas_disponibles").value
                };

                fetch(`/api-entradas/public/api/eventos/${eventoId}`, {
                    method: "PUT",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                })
                    .then(async res => {
                        const responseData = await leerJsonSeguro(res);

                        if (!res.ok) {
                            throw new Error(responseData.detalle || responseData.error || "No se pudo actualizar el evento.");
                        }

                        return responseData;
                    })
                    .then(responseData => {
                        if (responseData.id || responseData.success || !responseData.error) {
                            alert("Cambios guardados con éxito");
                        }
                        document.getElementById("resultado").textContent =
                            JSON.stringify(responseData, null, 2);
                    })
                    .catch(error => {
                        document.getElementById("resultado").textContent = error.message;
                    });
            }

            // 4. Subir imagen del evento
            function subirImagen() {
                const archivo = document.getElementById("nuevaImagen").files[0];
                if (!archivo) {
                    alert("Selecciona una imagen");
                    return;
                }

                const formData = new FormData();
                formData.append("imagen", archivo);

                fetch(`/api-entradas/public/api/eventos/${eventoId}/imagen`, {
                    method: "POST",
                    credentials: "include",
                    body: formData
                })
                    .then(res => res.json())
                    .then(data => {
                        alert("Imagen actualizada correctamente");
                        cargarEvento();
                    });
            }
        </script>
    </main>
    <footer>
        <div class="footer-content content-container">
            <p>&copy; 2026 Venta de Entradas. Todos los derechos reservados.</p>
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>
</body>

</html>
